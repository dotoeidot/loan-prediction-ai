<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

    <h1>Forgot Password?</h1>

    <p>Enter your registered username.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.email.errors }}

        {{ form.email.label_tag }}
        {{ form.email }}

        <button type="submit">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}">Back to Login</a>

</body>
</html>
