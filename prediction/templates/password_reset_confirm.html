<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
</head>
<body>

    {% if validlink %}

        <h1>Reset Your Password</h1>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Update Password</button>
        </form>

    {% else %}

        <h2>Invalid or Expired Link</h2>

        <p>Please request a new password reset link.</p>

        <a href="{% url 'password_reset' %}">
            Request New Link
        </a>

    {% endif %}

</body>
</html>
